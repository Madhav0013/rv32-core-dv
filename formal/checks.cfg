[options]
isa rv32i

[depth]
insn            15
reg        5    15
pc_fwd     5    10
pc_bwd     5    10
liveness   1 10 15
unique     1  5 10
causal     5    10

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_NRET 1
`define RISCV_FORMAL_XLEN 32
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_COMPRESSED 0
`define RISCV_FORMAL_ALIGNED_MEM 1

[script-sources]
read_verilog -sv @basedir@/cores/rv32i_core/rv32_pkg.sv
read_verilog -sv @basedir@/cores/rv32i_core/core.sv
read_verilog -sv @basedir@/cores/rv32i_core/alu.sv
read_verilog -sv @basedir@/cores/rv32i_core/regfile.sv
read_verilog -sv @basedir@/cores/rv32i_core/immgen.sv
read_verilog -sv @basedir@/cores/rv32i_core/decoder.sv
read_verilog -sv @basedir@/cores/rv32i_core/branch_unit.sv
read_verilog -sv @basedir@/cores/rv32i_core/forwarding_unit.sv
read_verilog -sv @basedir@/cores/rv32i_core/hazard_unit.sv
read_verilog -sv @basedir@/cores/rv32i_core/wrapper.sv
